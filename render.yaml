services:
  # --- Backend Web Service ---
  - type: web
    name: dr-assist-api
    env: node
    plan: free # Change to 'starter' if ML models need more RAM
    region: singapore # Change to your preferred region
    buildCommand: "cd backend && bash render-build.sh"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: MONGODB_URI
        sync: false # User will provide this in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: HF_API_URL
        sync: false # User will provide this from Hugging Face Space URL
      - key: CLIENT_URL
        value: https://dr-assist-ai.onrender.com
      - key: PORT
        value: 10000
      - key: PYTHON_CMD
        value: python3
      - key: PYTHON_VERSION
        value: 3.10.0

  # --- Frontend Static Site ---
  - type: web
    name: dr-assist-ai
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: https://dr-assist-api.onrender.com/api # Update after first deploy
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
